"Text-to-speech\",\n      \"ms\": 60\n    }\n  ],\n  \"QUICK_PROMPTS\": [\n    \"What credit cards do you offer?\",\n    \"What's the annual fee on the World Card?\",\n    \"What are the rewards on the LeXing Card, and can you also check my balance?\",\n    \"What's the minimum credit score to qualify?\"\n  ],\n  \"OOS_LABEL_ZH\": {\n    \"Account balance\": \"帳戶餘額\",\n    \"Lost\u002Fstolen card\": \"卡片遺失\u002F被盜\",\n    \"Dispute a charge\": \"帳款爭議\",\n    \"Cancel card\": \"取消卡片\",\n    \"Application status\": \"申請進度\",\n    \"Non-card banking\": \"非信用卡業務\",\n    \"Eligibility criteria\": \"申請資格\",\n    \"Unrecognized topic\": \"未辨識主題\",\n    \"Response validation failed\": \"回覆驗證未通過\"\n  },\n  \"TOPIC_ZH\": {\n    \"Overview\": \"總覽\",\n    \"Annual Fee\": \"年費\",\n    \"Domestic Cash Back\": \"國內現金回饋\",\n    \"Airport Transfers\": \"機場接送\",\n    \"Airport Lounge\": \"機場貴賓室\",\n    \"Overseas Cash Back\": \"海外現金回饋\",\n    \"Airport Parking\": \"機場停車\",\n    \"Travel Insurance\": \"旅遊保險\",\n    \"Lifestyle & Dining\": \"生活餐飲\",\n    \"Daily Cash Back\": \"日常現金回饋\",\n    \"Shopping & Dining\": \"購物餐飲\",\n    \"Transportation\": \"交通\",\n    \"HAPPY GO Rewards\": \"HAPPY GO 回饋\",\n    \"Dining\": \"餐飲\",\n    \"Golf\": \"高爾夫\",\n    \"General Cash Back\": \"一般現金回饋\",\n    \"Transportation Cash Back\": \"交通現金回饋\",\n    \"Auto & Insurance\": \"汽車與保險\",\n    \"Parking & Roadside\": \"停車與道路救援\",\n    \"Shopping\": \"購物\",\n    \"Smart Parking\": \"智慧停車\",\n    \"eTag POINTS\": \"eTag 點數\",\n    \"Relax+ Cash Back\": \"Relax+ 現金回饋\",\n    \"Children’s Floor Bonus\": \"兒童樓層加碼\",\n    \"Tuition Installments\": \"學費分期\",\n    \"Dining Privileges\": \"餐飲優惠\",\n    \"HAPPY GO Points\": \"HAPPY GO 點數\",\n    \"How to Apply\": \"如何申請\",\n    \"Card List\": \"卡片列表\",\n    \"Dining & Hotel\": \"餐飲與飯店\",\n    \"Parking\": \"停車\",\n    \"EasyCard & Tolls\": \"悠遊卡與通行費\",\n    \"Parking & Insurance\": \"停車與保險\",\n    \"Spending Limit\": \"消費額度\",\n    \"Charity Donations\": \"愛心捐款\"\n  }\n}\n<\u002Fscript>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;bankName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Far Eastern Bank&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;autoSpeak&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nconst CARD_DATA = JSON.parse(document.getElementById('card-data').textContent);\nconst { CARDS, GENERAL_SCRIPTS, APR_KEYWORDS, APR_RESPONSE, APR_RESPONSE_ZH, OOS, OOS_DESCRIPTIONS, STAGE_DEFS, QUICK_PROMPTS, OOS_LABEL_ZH, TOPIC_ZH } = CARD_DATA;\n\nfunction detectLang(text) {\n  return \u002F[\\u4e00-\\u9fff]\u002F.test(text) ? 'zh' : 'en';\n}\n\nfunction slug(s) { return s.toUpperCase().replace(\u002F[^A-Z0-9]+\u002Fg, '_').replace(\u002F^_|_$\u002Fg, ''); }\n\n\u002F\u002F Flatten the script library into an id-addressable index. The LLM below only\n\u002F\u002F ever picks an id — the actual customer-facing text always comes from this\n\u002F\u002F approved index, never from the model's own words, to avoid a paraphrase\n\u002F\u002F dropping or swapping a number (the exact compliance risk the script\n\u002F\u002F library's own notes call out).\nconst SCRIPT_INDEX = {};\nCARDS.forEach(card => {\n  card.topics.forEach(topic => {\n    const id = card.id + '_' + slug(topic.topic);\n    SCRIPT_INDEX[id] = { label: card.name + ' — ' + topic.topic, response: topic.response, responseZh: topic.responseZh };\n  });\n});\nGENERAL_SCRIPTS.forEach(gen => {\n  const id = 'GENERAL_' + slug(gen.topic);\n  SCRIPT_INDEX[id] = { label: gen.topic, response: gen.response, responseZh: gen.responseZh };\n});\nSCRIPT_INDEX['GENERAL_APR'] = { label: 'Interest Rate \u002F APR', response: APR_RESPONSE, responseZh: APR_RESPONSE_ZH };\n\nconst OOS_LABELS = OOS.map(o => o.label);\nconst KEYWORD_OPENERS_EN = [\"Happy to help — \", \"Sure — \"];\nconst KEYWORD_OPENERS_ZH = [\"很高興為您服務 — \", \"沒問題 — \"];\nconst AGENT_NAMES = ['Jamie Lin', 'Wei-Ting Chen', 'Priya Shah', 'Marcus Ho'];\nconst FRUSTRATION_KEYWORDS = ['angry', 'furious', 'terrible', 'awful', 'worst', 'useless', 'ridiculous', 'unacceptable', 'hate this', 'frustrated', 'frustrating', 'sick of', 'fed up', 'scam', 'rip off', '生氣', '很爛', '爛透了', '糟糕', '沒用', '受不了', '太扯', '氣死', '詐騙'];\nconst CARD_LIST_RE = \u002Fwhat (credit )?cards|which cards|cards? do you offer|products do you offer|all.*cards|有哪些卡|卡別|信用卡有哪些\u002Fi;\nconst DISPUTE_RE = \u002Fdispute|unauthorized charge|chargeback|不明扣款|爭議交易|盜刷|盜用\u002Fi;\nconst DISPUTE_REASONS = [\n  { id: 'unauthorized', en: 'Unauthorized transaction', zh: '未授權交易' },\n  { id: 'duplicate', en: 'Duplicate charge', zh: '重複扣款' },\n  { id: 'wrong_amount', en: 'Incorrect amount', zh: '金額錯誤' },\n  { id: 'not_received', en: \"Goods\u002Fservices not received\", zh: '未收到商品或服務' },\n];\nconst KEYWORD_NOMATCH_EN = \"I don't have that yet, but I'll connect you with a representative who can help!\";\nconst KEYWORD_NOMATCH_ZH = \"目前我沒有相關資訊,但我很樂意為您轉接客服人員協助處理!\";\nfunction warmWrap(text, lang) {\n  const openers = lang === 'zh' ? KEYWORD_OPENERS_ZH : KEYWORD_OPENERS_EN;\n  const opener = openers[Math.floor(Math.random() * openers.length)];\n  return opener + text;\n}\n\n\u002F\u002F Offline fallback path: no API key, no network call — local semantic-ish matching:\n\u002F\u002F tokenizes the query and scores it against each topic's keyword phrases using\n\u002F\u002F token overlap + typo-tolerant fuzzy matching, so phrasing\u002Fword-order\u002Fminor\n\u002F\u002F misspellings still match without requiring an exact substring.\nfunction tokenize(s) { return (s.toLowerCase().match(\u002F[a-z0-9]+|[\\u4e00-\\u9fff]\u002Fg) || []); }\nfunction closeEnough(a, b) {\n  if (a === b) return true;\n  const diffLen = Math.abs(a.length - b.length);\n  if (diffLen > 1) return false;\n  const minLen = Math.min(a.length, b.length);\n  \u002F\u002F Same-length (substitution) fuzz is collision-prone on short words (tell\u002Ftoll, cost\u002Flost) —\n  \u002F\u002F only allow it for longer words. Insertion\u002Fdeletion typos (anual\u002Fannual) are safer at 4+.\n  if (diffLen === 0 && minLen < 6) return false;\n  if (diffLen === 1 && minLen < 4) return false;\n  let i = 0, j = 0, diff = 0;\n  while (i < a.length && j < b.length) {\n    if (a[i] === b[j]) { i++; j++; continue; }\n    diff++;\n    if (diff > 1) return false;\n    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }\n  }\n  return true;\n}\n\u002F\u002F Grammatical filler words ('how', 'do', 'i', 'for', 'a'...) show up in almost any\n\u002F\u002F English question regardless of topic. Left unfiltered, a multi-word keyword like\n\u002F\u002F 'how do i apply' only needs 3 of its 4 tokens present ANYWHERE in the message to\n\u002F\u002F hit SEMANTIC_THRESHOLD -- and 'how'+'do'+'i' alone already clears that bar, so\n\u002F\u002F literally any 'How do I ___?' question (redeem points, check my balance, contact\n\u002F\u002F support) matched 'How to Apply' regardless of what was actually being asked,\n\u002F\u002F in the worst case with NO escalation at all. Stripping these before scoring\n\u002F\u002F means a keyword's real content word(s) must actually be present.\n\u002F\u002F 'tell'\u002F'ask'\u002F'show'\u002F'explain'\u002F'describe'\u002F'know' are the same category of generic\n\u002F\u002F request-framing verb as 'want'\u002F'need'\u002F'get'\u002F'please' above -- they describe the ACT of\n\u002F\u002F asking, not the content being asked about. Caught live: \"Tell me about the World Card \u002F\n\u002F\u002F Infinity Card\" grep-matched the unrelated Card Recommendation script on the single word\n\u002F\u002F \"tell\", purely because that script's OWN closing line (\"Tell me what matters most to\n\u002F\u002F you...\") happens to contain it -- an accident of phrasing, not a real topical signal.\nconst ENGLISH_STOPWORDS = new Set(['how', 'do', 'does', 'did', 'i', 'my', 'me', 'you', 'your', 'is', 'are', 'was', 'were', 'a', 'an', 'the', 'of', 'for', 'to', 'in', 'on', 'at', 'and', 'or', 'it', 'this', 'that', 'what', 'which', 'who', 'can', 'could', 'will', 'would', 'should', 'please', 'want', 'need', 'get', 'got', 'tell', 'ask', 'show', 'explain', 'describe', 'know']);\nconst SEMANTIC_THRESHOLD = 0.75;\n\n\u002F\u002F Bridges common paraphrases that share NO words at all, so keyword matching doesn't\n\u002F\u002F require the customer to happen to use the same vocabulary as the script library --\n\u002F\u002F e.g. \"credit line\" vs \"credit limit\" have zero token overlap, so the fuzzy scoring\n\u002F\u002F above (which only compares tokens that ARE present) can never connect them on its\n\u002F\u002F own. This is a small, fixed, hand-picked list, not real semantic understanding --\n\u002F\u002F an unlisted paraphrase still won't match. Each entry is a group of interchangeable\n\u002F\u002F phrases; if the message contains any one of them, the others are appended (in\n\u002F\u002F canonicalizeSynonyms below) so every existing substring\u002Ftoken check downstream\n\u002F\u002F benefits without having to know about synonyms itself.\nconst SYNONYM_GROUPS = [\n  ['credit limit', 'credit line', 'card limit'],\n  ['annual fee', 'yearly fee', 'membership fee'],\n  ['interest rate', 'finance charge'],\n  ['reward points', 'loyalty points', 'rewards program'],\n  ['lost card', 'missing card', 'misplaced card'],\n  ['stolen card', 'card was stolen', 'someone stole my card'],\n  ['cancel my card', 'close my account', 'terminate my card'],\n  ['minimum payment', 'min payment', 'minimum due'],\n  ['spending abroad', 'international spending', 'purchases abroad'],\n  ['airport lounge', 'lounge access', 'vip lounge'],\n  ['travel insurance', 'trip insurance', 'travel protection'],\n  ['balance transfer', 'transfer my balance'],\n  ['statement date', 'billing date', 'closing date'],\n  ['due date', 'payment deadline', 'payment due date'],\n  ['income requirement', 'salary requirement', 'minimum income'],\n];\nfunction expandSynonyms(text) {\n  const lower = text.toLowerCase();\n  const additions = [];\n  SYNONYM_GROUPS.forEach(group => {\n    if (group.some(phrase => lower.includes(phrase))) {\n      group.forEach(phrase => { if (!lower.includes(phrase)) additions.push(phrase); });\n    }\n  });\n  return additions.length ? text + ' ' + additions.join(' ') : text;\n}\n\nfunction findAllIndices(haystack, needle) {\n  const idxs = [];\n  if (!needle) return idxs;\n  let i = haystack.indexOf(needle);\n  while (i !== -1) { idxs.push(i); i = haystack.indexOf(needle, i + 1); }\n  return idxs;\n}\n\n\u002F\u002F Picks the single most specific card whose keyword appears in lowerText. Plain\n\u002F\u002F \"does any keyword match\" isn't enough — e.g. \"Premier Happy Card\" also contains\n\u002F\u002F the Happy Card's own keyword \"happy card\" as a coincidental substring. Preferring\n\u002F\u002F the longest matching keyword lets \"premier happy\" win over that shorter overlap;\n\u002F\u002F if two cards tie on specificity there's genuine ambiguity, so return null.\nfunction mostSpecificCardMatch(lowerText) {\n  const matches = CARDS.map(c => {\n    const bestLen = c.keywords.reduce((max, kw) => lowerText.includes(kw.toLowerCase()) ? Math.max(max, kw.length) : max, 0);\n    return bestLen ? { card: c, len: bestLen } : null;\n  }).filter(Boolean);\n  if (!matches.length) return null;\n  const maxLen = Math.max(...matches.map(m => m.len));\n  const best = matches.filter(m => m.len === maxLen);\n  return best.length === 1 ? best[0].card : null;\n}\n\n\u002F\u002F Deterministically resolves which card the last user turn named, so a bare\n\u002F\u002F topic-only follow-up (e.g. \"what about the airport transfers?\") can be\n\u002F\u002F pinned to a specific card instead of left for keyword fuzz \u002F model guessing.\nfunction resolveContextCardId(history) {\n  if (!history || !history.length) return null;\n  for (let i = history.length - 1; i >= 0; i--) {\n    const h = history[i];\n    if (h.role !== 'user') continue;\n    const hLower = (h.content || '').toLowerCase();\n    const hit = mostSpecificCardMatch(hLower);\n    if (hit) return hit.id;\n  }\n  return null;\n}\n\nfunction classifyKeyword(text, history) {\n  const lang = detectLang(text);\n  const matchText = expandSynonyms(text);\n  const lower = matchText.toLowerCase();\n  const inputTokens = tokenize(matchText);\n  const semanticScore = (kw) => {\n    const kwLower = kw.toLowerCase();\n    if (lower.includes(kwLower)) return 1;\n    \u002F\u002F A CJK keyword's individual characters are each far too overloaded on their\n    \u002F\u002F own (a character like 'overseas' or 'cash' turns up in countless unrelated\n    \u002F\u002F phrases) for 'most of these characters appear SOMEWHERE in the message' to\n    \u002F\u002F mean anything close to 'the user is asking about this keyword' -- unlike an\n    \u002F\u002F exact substring hit above, or an English word-token match (whole words carry\n    \u002F\u002F real per-token meaning). Falling back to overlapping 2-character bigrams\n    \u002F\u002F instead requires the characters to appear as ADJACENT pairs somewhere in the\n    \u002F\u002F message, which is a much closer proxy for 'this phrase (or a close variant)\n    \u002F\u002F is actually present' than scattered single-character presence.\n    if (\u002F[\\u4e00-\\u9fff]\u002F.test(kw)) {\n      const kwGrams = cjkBigrams(kwLower);\n      if (!kwGrams.length) return 0;\n      const inputGrams = new Set(cjkBigrams(lower));\n      const matched = kwGrams.filter(g => inputGrams.has(g)).length;\n      return matched \u002F kwGrams.length;\n    }\n    const kwTokensRaw = tokenize(kwLower);\n    if (!kwTokensRaw.length) return 0;\n    const kwTokens = kwTokensRaw.filter(t => !ENGLISH_STOPWORDS.has(t));\n    const effectiveTokens = kwTokens.length ? kwTokens : kwTokensRaw;\n    let matched = 0;\n    effectiveTokens.forEach(kt => {\n      if (inputTokens.some(it => it === kt || closeEnough(it, kt))) matched++;\n    });\n    return matched \u002F effectiveTokens.length;\n  };\n  const contains = (kw) => semanticScore(kw) >= SEMANTIC_THRESHOLD;\n\n  const matchedOos = OOS.find(o => o.keywords.some(contains));\n\n  \u002F\u002F Which cards does this message name? A card can coincidentally match via another\n  \u002F\u002F card's substring — e.g. \"Premier Happy Card\" contains the Happy Card's own keyword\n  \u002F\u002F \"happy card\". Only drop a shorter match when EVERY occurrence of it sits fully\n  \u002F\u002F inside a longer match's span (a true coincidental overlap); a card named again at a\n  \u002F\u002F separate position (e.g. \"compare the Premier Happy Card and the Happy Card\") keeps\n  \u002F\u002F its own mention regardless of length.\n  const rawMentioned = CARDS.filter(c => c.keywords.some(contains));\n  const withExactSpans = rawMentioned.map(c => {\n    const exactKws = c.keywords.filter(kw => lower.includes(kw.toLowerCase()));\n    if (!exactKws.length) return { card: c, exact: null };\n    const bestKw = exactKws.sort((a, b) => b.length - a.length)[0].toLowerCase();\n    return { card: c, exact: bestKw, occurrences: findAllIndices(lower, bestKw) };\n  });\n  \u002F\u002F A card matched only through the fuzzy\u002Ftypo-tolerant fallback (no literal substring\n  \u002F\u002F at all — e.g. NCTOP's \"infinity card\" fuzzy-matching HTOP's own \"happy card\n  \u002F\u002F infinite\" via infinite≈infinity) is a much weaker signal than a real exact-substring\n  \u002F\u002F mention elsewhere. When at least one card matched exactly, drop the fuzzy-only ones.\n  const anyExact = withExactSpans.some(w => w.exact);\n  const exactCandidates = anyExact ? withExactSpans.filter(w => w.exact) : withExactSpans;\n  const longest = exactCandidates.filter(w => w.exact).sort((a, b) => b.exact.length - a.exact.length)[0];\n  const mentionedCards = !longest ? exactCandidates.map(w => w.card) : exactCandidates\n    .filter(w => {\n      if (!w.exact || w.card === longest.card) return true;\n      const longestStart = longest.occurrences[0], longestEnd = longestStart + longest.exact.length;\n      return w.occurrences.some(start => !(start < longestEnd && longestStart < start + w.exact.length));\n    })\n    .map(w => w.card);\n  \u002F\u002F Resolve which card this topic-only follow-up is about from conversation history\n  \u002F\u002F when the current message doesn't name a card itself (e.g. \"what about the annual fee?\").\n  const mentionedCardIds = mentionedCards.map(c => c.id);\n  const contextCardId = mentionedCardIds.length ? null : resolveContextCardId(history);\n\n  const matchedIds = [];\n  CARDS.forEach(card => {\n    card.topics.forEach(topic => {\n      if (!topic.keywords.length || !topic.keywords.some(contains)) return;\n      if (mentionedCardIds.length) {\n        if (mentionedCardIds.includes(card.id)) matchedIds.push(card.id + '_' + slug(topic.topic));\n      } else if (contextCardId) {\n        if (card.id === contextCardId) matchedIds.push(card.id + '_' + slug(topic.topic));\n      } else {\n        matchedIds.push(card.id + '_' + slug(topic.topic));\n      }\n    });\n  });\n  GENERAL_SCRIPTS.forEach(gen => {\n    const id = 'GENERAL_' + slug(gen.topic);\n    \u002F\u002F \"Card List\" is only for a fully generic \"what cards do you offer\" question with\n    \u002F\u002F no card named and no specific topic matched — its own keyword \"cards\" fuzzy-\n    \u002F\u002F tolerates the singular \"card\" (so naming specific cards can spuriously trigger it,\n    \u002F\u002F since every card name literally contains \"... Card\"), and \"kinds\" fuzzy-tolerates\n    \u002F\u002F \"kids\" (so a Children's Floor Bonus match on \"kids\" could too). Whenever anything\n    \u002F\u002F more specific already answers the question, that wins over the generic catch-all —\n    \u002F\u002F and a matched OOS category counts as \"more specific\" too: an escalation like \"I\n    \u002F\u002F lost my card\" or \"cancel my card\" says \"card\" (singular) and would otherwise drag\n    \u002F\u002F the entire 16-card catalog into what should be a clean handoff.\n    if (id === 'GENERAL_CARD_LIST' && (mentionedCardIds.length || matchedIds.length || matchedOos)) return;\n    if (gen.keywords.some(contains)) matchedIds.push(id);\n  });\n  if (APR_KEYWORDS.some(contains)) matchedIds.push('GENERAL_APR');\n\n  \u002F\u002F A card is named but no specific topic matched (e.g. \"tell me about the happy card\") —\n  \u002F\u002F fall back to that card's Overview topic instead of a no-match.\n  if (!matchedIds.length && mentionedCardIds.length) {\n    mentionedCardIds.forEach(cid => matchedIds.push(cid + '_' + slug('Overview')));\n  }\n\n  const scripts = matchedIds.filter(id => SCRIPT_INDEX[id]).map(id => SCRIPT_INDEX[id]);\n  const oos = matchedOos ? { label: matchedOos.label } : null;\n  const usedContext = !mentionedCardIds.length && !!contextCardId;\n\n  let script = null;\n  if (scripts.length === 1) {\n    script = scripts[0];\n  } else if (scripts.length > 1) {\n    script = {\n      label: scripts.map(s => s.label).join(' + '),\n      response: combineScripts(scripts, 'response'),\n      responseZh: combineScripts(scripts, 'responseZh'),\n    };\n  }\n\n  if (script && oos) return { kind: 'partial', lang, script, oos, usedContext };\n  if (script) return { kind: 'match', lang, script, usedContext };\n  if (oos) return { kind: 'nomatch', lang, oos, usedContext };\n  return { kind: 'nomatch', lang, oos: { label: 'Unrecognized topic' }, usedContext };\n}\n\nfunction buildKbFactLines(lang) {\n  return Object.keys(SCRIPT_INDEX).map(id => {\n    const s = SCRIPT_INDEX[id];\n    const fact = lang === 'zh' ? (s.responseZh || s.response) : s.response;\n    return id + ': ' + s.label + ' -- ' + fact;\n  });\n}\n\nconst RESPOND_SYSTEM_PROMPT_HEAD = `You are a bank credit-card FAQ phone assistant. Given the customer's message (English or Chinese, any phrasing) and the knowledge base below, do BOTH classification and reply generation in one pass — never invent facts not present in the matched entries.\n\nOUT-OF-SCOPE CATEGORIES: ${OOS_LABELS.join(', ')}\n\nClassification rules:\n- \"matches\": every knowledge-base id below that answers the question — usually just one, but if the customer asks which CARDS offer some specific benefit without naming one card, return the id for EVERY card with a matching topic. A \"benefits of every card\" question must match every card's own Overview id. Empty array if nothing fits.\n- Match on the customer's underlying intent, not literal wording -- treat synonyms, paraphrases, spelling variants (British vs. American, typos), and indirect statements (e.g. \"what if I like traveling\" implying a travel-focused card) as equivalent to however the knowledge base itself is worded.\n- GENERAL_CARD_LIST is ONLY for a fully generic \"what cards\u002Fproducts do you offer\" question with no specific benefit or topic named. Never combine it with GENERAL_CARD_RECOMMENDATION in the same answer -- they answer different questions (a menu of every category vs. a personalized suggestion) and sharing related vocabulary is not the same as sharing intent; pick whichever one the question actually asked for.\n- \"oos\": the single best-fitting out-of-scope category above, or null. Eligibility \u002F \"do I qualify\" \u002F minimum income or credit score questions always get \"Eligibility criteria\".\n- If the message mixes an in-scope question with an out-of-scope request (e.g. also asks to check a balance or cancel a card), set both matches and oos.\n\nReply-generation rules (only when matches is non-empty):\n- Write a VERY SHORT, natural reply grounded ONLY in the matched entries' facts below — 1 sentence per matched fact, the absolute minimum needed to answer directly.\n- Never invent, guess, or alter any number, threshold, date, or term not present in the matched facts — every figure you state must come straight from the facts.\n- Don't repeat facts word-for-word or list every detail — rephrase naturally, weaving multiple facts into one tight answer rather than a list.\n- If oos is also set, add one brief closing sentence noting you'll connect them with a representative for that remaining part.\n- Tone: warm, upbeat, polite, but brief — like a happy-to-help agent on a phone call, not gushing.\n- Output the reply as PLAIN PROSE ONLY — no Markdown, asterisks, headers, or bullet\u002Fnumbered lists.\n- Reply in the same language as the customer's message (Traditional Chinese if they wrote in Chinese, English otherwise).\n- Leave \"reply\" as an empty string when matches is empty — a pure escalation needs no generated reply.\n\nRespond with ONLY a compact JSON object, no prose: {\"matches\": [\"<id>\", ...], \"oos\": \"<label>\"|null, \"reply\": \"<generated reply text, or \\\"\\\" if matches is empty>\"}`;\n\nfunction combineScripts(scripts, field) {\n  return scripts.map(s => '• ' + s.label + ' — ' + (s[field] || s.response)).join('\\n');\n}\n\n\u002F\u002F Full-text fallback for classifyAndRespond only (the API-key\u002FLLM path): the keyword-tag\n\u002F\u002F checks above only search each topic's short, curated `keywords` list, so a query whose\n\u002F\u002F wording appears directly in the topic's PROSE but was never rehearsed as a keyword tag\n\u002F\u002F on that topic (e.g. \"privileges\" only tagged on the general Dining Privileges topic,\n\u002F\u002F even though \"shopping privileges\" \u002F \"parking privileges\" also appear directly in other\n\u002F\u002F cards' own answer text) falls through to the generic Card List catch-all instead of the\n\u002F\u002F topic that actually answers it. This greps the response\u002FresponseZh text itself for the\n\u002F\u002F query's distinctive content words\u002FCJK bigrams, reusing the same COMMON_TOKENS\u002F\n\u002F\u002F COMMON_BIGRAMS_ZH domain-wide-filler exclusion as the output-validation grounding check\n\u002F\u002F below so generic words (\"card\", \"you\", \"free\") can't trigger it.\n\u002F\u002F \"happy\" sits under the door's own COMMON_TOKENS cutoff (~18% of scripts) despite being\n\u002F\u002F a brand-name fragment (\"Happy Card\", \"Happy+ Family Card\", \"Happy Unlimited Card\", the\n\u002F\u002F \"HAPPY GO\" points program) that shows up across a wide swath of UNRELATED cards' prose\n\u002F\u002F purely because of that shared branding, not because it signals anything about the\n\u002F\u002F topic being asked about -- e.g. \"do happy go points expire\" pulled in several other\n\u002F\u002F cards' cash-back topics on the word \"happy\" alone. Lowering COMMON_TOKENS' own\n\u002F\u002F doc-frequency threshold to catch it isn't safe: genuinely useful, similarly-frequent\n\u002F\u002F words (\"airport\", \"travel\", \"month\", \"annual\") sit at or above the same frequency and\n\u002F\u002F would get excluded too, hurting recall elsewhere. Kept as its own small, explicit list\n\u002F\u002F rather than a blanket threshold change for exactly that reason -- add future entries\n\u002F\u002F here only when they're the same kind of brand-fragment case, not just \"a common word\".\nconst GREP_BRAND_STOPWORDS = new Set(['happy', 'credit', 'offer']);\nfunction contentTokens(text) {\n  \u002F\u002F Length > 4 (not >= 4): briefly loosened to >= 4 on the theory that scoredGrepHits'\n  \u002F\u002F strong\u002Fcorroboration scoring would keep short filler words (\"each\", \"some\", \"with\")\n  \u002F\u002F safe on their own merits, letting real 4-letter content words (\"Benz\", \"gold\")\n  \u002F\u002F through too. That didn't hold up under a wider sweep: \"does the eTag card come with\n  \u002F\u002F some benefits\" false-matched Smart Parking via \"come\", \"what perks come with the\n  \u002F\u002F LeXing card\" false-matched Dining Privileges + Card Recommendation via \"come\"\u002F\"with\",\n  \u002F\u002F and \"tell me about each card you have with the happy card\" false-matched Annual Fee\n  \u002F\u002F via \"each\"\u002F\"with\" -- ordinary short connector words are common enough across THIS\n  \u002F\u002F knowledge base's prose (not just filler in the query) that they clear the scoring's\n  \u002F\u002F safety margin too easily. Reverted to > 4: losing \"Benz\"-style short proper nouns as\n  \u002F\u002F a grep signal is a smaller cost than reopening this whole class of false match.\n  return tokenize(text).filter(t => t.length > 4 && !ENGLISH_STOPWORDS.has(t) && !COMMON_TOKENS.has(t) && !GREP_BRAND_STOPWORDS.has(t));\n}\nfunction singleTokenHit(token, isBigram, factText) {\n  if (!factText) return false;\n  if (isBigram) return cjkBigrams(factText).includes(token);\n  return tokenize(factText).some(ft => ft === token || closeEnough(ft, token));\n}\n\u002F\u002F A single grep token is only trusted alone when it's actually RARE within the current\n\u002F\u002F search scope (e.g. \"privileges\", \"Benz\" -- each shows up in a handful of topics at\n\u002F\u002F most). A token that clears length\u002Fstopword\u002FCOMMON_TOKENS filtering but still recurs\n\u002F\u002F across a large slice of the scope (e.g. \"points\" -- generic reward-domain vocabulary\n\u002F\u002F under COMMON_TOKENS' 30% cutoff but still common enough within cash-back-flavored\n\u002F\u002F topics specifically) shouldn't get to single-handedly pull in every topic that merely\n\u002F\u002F mentions it; it may still contribute, but only alongside a SECOND independently-\n\u002F\u002F matching query token corroborating the same topic. This scope-relative fraction (not a\n\u002F\u002F fixed count) is why it's computed per call rather than precomputed like COMMON_TOKENS --\n\u002F\u002F the \"how many topics is normal\" baseline differs a lot between a single-card scope\n\u002F\u002F (~5-10 topics) and the whole catalog (~95).\nconst GREP_STRONG_FRACTION = 0.1;\nfunction scoredGrepHits(queryTokens, queryBigrams, searchCards, eligibleGeneral) {\n  const totalTopics = searchCards.reduce((n, c) => n + c.topics.length, 0) + eligibleGeneral.length;\n  if (!totalTopics) return [];\n  const factTextOf = (topicOrGen) => (topicOrGen.response || '') + ' ' + (topicOrGen.responseZh || '');\n  const hitsFor = (token, isBigram) => {\n    const hits = new Set();\n    searchCards.forEach(card => card.topics.forEach(topic => {\n      if (singleTokenHit(token, isBigram, factTextOf(topic))) hits.add(card.id + '_' + slug(topic.topic));\n    }));\n    eligibleGeneral.forEach(gen => {\n      if (singleTokenHit(token, isBigram, factTextOf(gen))) hits.add('GENERAL_' + slug(gen.topic));\n    });\n    return hits;\n  };\n  const strongHits = new Set();\n  const idTokenCount = new Map();\n  queryTokens.forEach(t => {\n    const hits = hitsFor(t, false);\n    const strong = hits.size > 0 && hits.size \u002F totalTopics <= GREP_STRONG_FRACTION;\n    hits.forEach(id => {\n      idTokenCount.set(id, (idTokenCount.get(id) || 0) + 1);\n      if (strong) strongHits.add(id);\n    });\n  });\n  queryBigrams.forEach(g => {\n    const hits = hitsFor(g, true);\n    const strong = hits.size > 0 && hits.size \u002F totalTopics <= GREP_STRONG_FRACTION;\n    hits.forEach(id => {\n      idTokenCount.set(id, (idTokenCount.get(id) || 0) + 1);\n      if (strong) strongHits.add(id);\n    });\n  });\n  const result = [];\n  idTokenCount.forEach((count, id) => {\n    if (strongHits.has(id) || count >= 2) result.push(id);\n  });\n  return result;\n}\n\n\u002F\u002F Generation step: the classifier above only picks WHICH facts apply; this\n\u002F\u002F step phrases the actual reply. It's instructed to draw only on the given\n\u002F\u002F facts and never alter a number\u002Fthreshold, but doesn't have to quote them\n\u002F\u002F word-for-word — natural CSR phrasing, especially when combining more than\n\u002F\u002F one script's facts into a single answer.\nlet lastApiIssue = null;\nasync function classifyAndRespond(text, history) {\n  const lang = detectLang(text);\n  const fallback = { kind: 'nomatch', lang, oos: { label: 'Unrecognized topic' } };\n  \u002F\u002F Only hint at the prior card when the LATEST message doesn't itself name any\n  \u002F\u002F card — otherwise an explicit (even similarly-named) card mention could get\n  \u002F\u002F biased toward the earlier one instead of overriding it.\n  const matchText = expandSynonyms(text);\n  const lowerText = matchText.toLowerCase();\n  const kwContains = (kw) => {\n    const kwLower = kw.toLowerCase();\n    if (lowerText.includes(kwLower)) return true;\n    const kwTokens = tokenize(kwLower);\n    if (!kwTokens.length) return false;\n    const inputTokens = tokenize(matchText);\n    return kwTokens.filter(kt => inputTokens.some(it => it === kt || closeEnough(it, kt))).length \u002F kwTokens.length >= SEMANTIC_THRESHOLD;\n  };\n  const mentionsCard = CARDS.some(c => c.keywords.some(kw => lowerText.includes(kw.toLowerCase())));\n  const contextCard = mentionsCard ? null : CARDS.find(c => c.id === resolveContextCardId(history));\n  \u002F\u002F Mirrors classifyKeyword's own usedContext exactly (same \"no card named here, but one\n  \u002F\u002F was resolved from a recent prior turn\" definition) -- this function never exposed an\n  \u002F\u002F equivalent signal of its own, so the caller was approximating it as \"any history\n  \u002F\u002F exists at all\" for this mode, which shows the \"using context\" disclosure on literally\n  \u002F\u002F every message after the first in a conversation, self-contained or not (e.g. a fully\n  \u002F\u002F explicit \"what's the annual fee on the World Card?\" as message #2 still claimed to be\n  \u002F\u002F using context from earlier). Computed once, reused by every return path below.\n  const usedContext = !mentionsCard && !!contextCard;\n  const contextNote = contextCard\n    ? `\\n\\nThe customer was just discussing the ${contextCard.name} (id prefix \"${contextCard.id}_\"). IF the latest message is a topic-only follow-up about that same card (naming a topic but not repeating the card's name, e.g. \"what about the annual fee?\"), resolve it against that card's knowledge-base id — don't return no-match just because the card name isn't repeated. IF instead the latest message is unrelated to that card (a new out-of-scope request, a different topic entirely, etc.), classify it normally on its own merits — do not force a connection to that card just because it was discussed earlier.`\n    : '';\n  \u002F\u002F None of these failure modes (no API configured, the call itself failing, or the\n  \u002F\u002F model's reply not parsing as JSON) should bail out early — each still falls\n  \u002F\u002F through to the card-mention safety net below with empty matches\u002Foos, instead\n  \u002F\u002F of leaving the customer with nothing just because the model call had an issue.\n  let parsed = { matches: [], oos: null, reply: '' };\n  if (!window.claude || !window.claude.complete) {\n    lastApiIssue = 'unavailable';\n  } else {\n    const system = RESPOND_SYSTEM_PROMPT_HEAD +\n      '\\n\\nKNOWLEDGE BASE (id: label -- fact):\\n' + buildKbFactLines(lang).join('\\n') +\n      '\\n\\nThe customer\\'s prior turns are included for context — use them to resolve references like \"that card\" or \"what about parking\" to whatever was discussed before, but classify and answer based on the LATEST message.' + contextNote;\n    let raw;\n    try {\n      raw = await window.claude.complete({\n        system,\n        messages: [...(history || []), { role: 'user', content: text }],\n        max_tokens: 500,\n        temperature: 0,\n      });\n    } catch (e) { lastApiIssue = e && e.code === 'no_api_key' ? 'no_api_key' : 'failed'; raw = null; }\n    if (raw != null) {\n      try {\n        const jsonStr = (raw.match(\u002F\\{[\\s\\S]*\\}\u002F) || [raw])[0];\n        parsed = JSON.parse(jsonStr);\n      } catch (e) { \u002F* keep the empty default, let the safety net below decide *\u002F }\n    }\n  }\n\n  const ids = Array.isArray(parsed.matches) ? parsed.matches : (parsed.match ? [parsed.match] : []);\n  let matchedIds = ids.filter(id => SCRIPT_INDEX[id]);\n  const oosLabel = parsed.oos && OOS_LABELS.includes(parsed.oos) ? parsed.oos : null;\n  let oos = oosLabel ? { label: oosLabel } : null;\n  if (!oos) {\n    const oosKwMatch = OOS.find(o => o.keywords.some(kwContains));\n    if (oosKwMatch) oos = { label: oosKwMatch.label };\n  }\n  let reply = typeof parsed.reply === 'string' ? parsed.reply.trim() : '';\n  let safetyNetAdded = false;\n  \u002F\u002F Set below only when the sole match is a card's bare Overview reached purely because\n  \u002F\u002F the card was named\u002Fin-context with no specific topic keyword hit — a weak, generic\n  \u002F\u002F guess the grep pass further down should be allowed to replace with something more\n  \u002F\u002F specific, same as it already does for the site-wide GENERAL_CARD_LIST catch-all.\n  let overviewOnlyCard = null;\n\n  \u002F\u002F Safety net: semantic classification can occasionally miss an unambiguous card\n  \u002F\u002F mention outright (model non-determinism) — sometimes even pairing the miss with\n  \u002F\u002F a spurious oos label, and it can also miss a topic-only follow-up (e.g. \"what\n  \u002F\u002F about the Relax+ Cash Back?\") that never repeats the card name and relied on\n  \u002F\u002F contextNote alone getting through to the model. If nothing matched yet, fall back\n  \u002F\u002F to the named card, or else the context card already resolved above, and prefer\n  \u002F\u002F whichever of that card's topics the message's keywords actually hit over a bare\n  \u002F\u002F Overview.\n  if (!matchedIds.length) {\n    const namedCard = mostSpecificCardMatch(lowerText);\n    const fallbackCard = namedCard || contextCard;\n    if (fallbackCard) {\n      const inputTokens = tokenize(matchText);\n      const topicContains = (kw) => {\n        const kwLower = kw.toLowerCase();\n        if (lowerText.includes(kwLower)) return true;\n        const kwTokens = tokenize(kwLower);\n        if (!kwTokens.length) return false;\n        return kwTokens.filter(kt => inputTokens.some(it => it === kt || closeEnough(it, kt))).length \u002F kwTokens.length >= SEMANTIC_THRESHOLD;\n      };\n      \u002F\u002F Rank candidates by their most specific (longest exact-substring) keyword match —\n      \u002F\u002F same principle as mostSpecificCardMatch above — so e.g. \"overseas cashback\" resolves\n      \u002F\u002F to the Overseas Cash Back topic itself rather than an earlier topic whose own keyword\n      \u002F\u002F (\"cashback\") happens to be a substring of it.\n      const topicCandidates = fallbackCard.topics\n        .filter(t => t.keywords.length && t.keywords.some(topicContains))\n        .map(t => {\n          const exactKws = t.keywords.filter(kw => lowerText.includes(kw.toLowerCase()));\n          const bestLen = exactKws.length ? Math.max(...exactKws.map(kw => kw.length)) : 0;\n          return { topic: t, bestLen };\n        });\n      const topicMatch = topicCandidates.length\n        ? topicCandidates.sort((a, b) => b.bestLen - a.bestLen)[0].topic\n        : null;\n      \u002F\u002F A card named OUTRIGHT in this message falls back to its Overview even with no\n      \u002F\u002F specific topic matched (e.g. \"tell me about the eTag card\") — that mirrors\n      \u002F\u002F classifyKeyword's own explicit-mention fallback. But a card resolved only from\n      \u002F\u002F stale conversation CONTEXT (nothing in *this* message names it) should only be\n      \u002F\u002F trusted when an actual topic keyword hit — otherwise an unrelated follow-up like\n      \u002F\u002F \"I lost my card\" or \"what's my balance\" right after discussing a card would get\n      \u002F\u002F wrongly pulled into that card's Overview instead of staying a clean escalation.\n      if (namedCard || topicMatch) {\n        const fallbackId = fallbackCard.id + '_' + slug(topicMatch ? topicMatch.topic : 'Overview');\n        if (SCRIPT_INDEX[fallbackId]) {\n          matchedIds.push(fallbackId);\n          safetyNetAdded = true;\n          if (!topicMatch) overviewOnlyCard = fallbackCard;\n        }\n      }\n    }\n  }\n\n  \u002F\u002F General-topic\u002FAPR keyword check ALWAYS runs here, layering onto whatever the model\n  \u002F\u002F or the card-topic fallback above already found — mirroring classifyKeyword, which\n  \u002F\u002F independently checks GENERAL_SCRIPTS\u002FAPR on every call and combines every hit into\n  \u002F\u002F one answer rather than stopping once a card topic matches. Without this running\n  \u002F\u002F unconditionally, a query like \"what cards offer dining privileges\" while a card is\n  \u002F\u002F in context would stop at that one card's own topic and never surface the\n  \u002F\u002F GENERAL_SCRIPTS summary covering every card.\n  {\n    const beforeCount = matchedIds.length;\n    if (!mostSpecificCardMatch(lowerText) && !contextCard) {\n      CARDS.forEach(card => card.topics.forEach(topic => {\n        if (!topic.keywords.length || !topic.keywords.some(kwContains)) return;\n        const id = card.id + '_' + slug(topic.topic);\n        if (!matchedIds.includes(id)) matchedIds.push(id);\n      }));\n    }\n    \u002F\u002F Only grep when nothing REAL has matched by any keyword tag yet (model, card\n    \u002F\u002F fallback, or the topic keyword-tag pass just above) — a query that already hit a\n    \u002F\u002F curated keyword shouldn't also pull in unrelated topics over an incidental shared\n    \u002F\u002F word in their prose. A matchedIds of JUST GENERAL_CARD_LIST doesn't count as real\n    \u002F\u002F for this purpose: the model itself can (incorrectly) land on that generic catch-all\n    \u002F\u002F for a query naming a specific benefit across cards -- exactly the failure mode this\n    \u002F\u002F whole grep pass exists to fix -- so treat it the same as no match and let a genuine\n    \u002F\u002F grep hit replace it, same as any other more-specific signal already outranks it\n    \u002F\u002F elsewhere in this function. Runs before the GENERAL_CARD_LIST guard below so a grep\n    \u002F\u002F hit correctly suppresses that catch-all, same as any other real match would.\n    \u002F\u002F Also skipped once an OOS category is already resolved: an escalation like \"who can\n    \u002F\u002F apply\" or \"資格\" (eligibility) is short and low-content enough that its one or two\n    \u002F\u002F surviving tokens\u002Fbigrams can coincidentally appear inside some unrelated topic's\n    \u002F\u002F prose (e.g. \"eligible dependents\" -> \"符合資格的家屬\" contains \"資格\" literally) —\n    \u002F\u002F a clean OOS escalation must win rather than get bundled with a wrong card's details.\n    \u002F\u002F\n    \u002F\u002F A lone Overview reached via overviewOnlyCard is just as generic as GENERAL_CARD_LIST\n    \u002F\u002F in miniature -- \"what about the unlimited transfers on the Premier Happy Card\" names\n    \u002F\u002F the card outright but the actual content word (\"transfers\") was never rehearsed as\n    \u002F\u002F a keyword on the Airport Transfers topic, so the safety net above fell back to a bare\n    \u002F\u002F Overview instead of the topic that actually answers it. Once a card IS explicitly\n    \u002F\u002F named this way, grep stays scoped to just that card's own topics (plus general\n    \u002F\u002F scripts) rather than the whole catalog -- the customer asked about one specific card,\n    \u002F\u002F so pulling in an unrelated card's topic on a coincidental shared word would be a worse\n    \u002F\u002F answer than the generic Overview it would be replacing.\n    const onlyCardList = matchedIds.length === 1 && matchedIds[0] === 'GENERAL_CARD_LIST';\n    const onlyWeakOverview = !!overviewOnlyCard && matchedIds.length === 1 && matchedIds[0] === overviewOnlyCard.id + '_' + slug('Overview');\n    if ((!matchedIds.length || onlyCardList || onlyWeakOverview) && !oos) {\n      const queryTokens = contentTokens(matchText);\n      const queryBigrams = cjkBigrams(matchText).filter(g => !COMMON_BIGRAMS_ZH.has(g));\n      if (queryTokens.length || queryBigrams.length) {\n        const searchCards = onlyWeakOverview ? [overviewOnlyCard] : CARDS;\n        \u002F\u002F GENERAL_CARD_LIST and GENERAL_CARD_RECOMMENDATION are both excluded from grep,\n        \u002F\u002F not just keyword-tag matching -- Card List is a pure catch-all with no real\n        \u002F\u002F facts to find, and Card Recommendation is the one GENERAL_SCRIPTS entry that's\n        \u002F\u002F conversational rather than factual (it closes by inviting the customer to say\n        \u002F\u002F what matters most, in EITHER language). That closing phrasing unavoidably shares\n        \u002F\u002F vocabulary with how customers naturally phrase their OWN requests (\"tell me\n        \u002F\u002F more about X\" in English; \"告訴我\"\u002F\"訴我\" -- \"tell me\" -- in Chinese), so it kept\n        \u002F\u002F grep-matching on pure incidental word\u002Fbigram overlap: \"Tell me about the World\n        \u002F\u002F Card\" and \"請告訴我世界卡的資訊\" (\"please tell me about the World Card\") both\n        \u002F\u002F pulled in Card Recommendation's full pitch alongside the real answer, for no\n        \u002F\u002F reason connected to what was actually asked. Rewording around every such\n        \u002F\u002F overlapping phrase in two languages is whack-a-mole; excluding it from grep\n        \u002F\u002F entirely and leaving its own curated keywords (rewards\u002Frecommend\u002Fsuggest, etc.)\n        \u002F\u002F as the only way in is the robust fix, same treatment GENERAL_CARD_LIST already\n        \u002F\u002F gets and for the same underlying reason -- neither is a source of specific,\n        \u002F\u002F grep-worthy card facts the way Dining Privileges or HAPPY GO Points are.\n        const eligibleGeneral = GENERAL_SCRIPTS.filter(g => {\n          const id = 'GENERAL_' + slug(g.topic);\n          return id !== 'GENERAL_CARD_LIST' && id !== 'GENERAL_CARD_RECOMMENDATION';\n        });\n        const grepHits = scoredGrepHits(queryTokens, queryBigrams, searchCards, eligibleGeneral);\n        \u002F\u002F A genuine grep hit is strictly more specific than the site-wide Card List\n        \u002F\u002F catch-all -- drop that one rather than combine, so the reply doesn't\n        \u002F\u002F awkwardly mix a real answer with \"here are all our card categories\".\n        \u002F\u002F\n        \u002F\u002F A named card's own bare Overview is different: it's still genuinely ABOUT\n        \u002F\u002F the card being asked about, not an empty catch-all, so a grep hit should\n        \u002F\u002F SUPPLEMENT it, never replace it outright. Caught live: \"what perks come\n        \u002F\u002F with the LeXing card\" grep-matched Dining Privileges and Card Recommendation\n        \u002F\u002F (both genuinely mention \"LeXing\" by name -- Dining Privileges lists it among\n        \u002F\u002F cards WITHOUT dining perks, Card Recommendation cites it for commuters) and,\n        \u002F\u002F under the old replace-on-any-hit rule, that fully discarded LeXing's own\n        \u002F\u002F Overview -- the customer asked about LeXing specifically and got back an\n        \u002F\u002F answer that never actually describes LeXing's own card.\n        if (grepHits.length) {\n          if (onlyCardList) matchedIds.length = 0;\n          grepHits.forEach(id => { if (!matchedIds.includes(id)) matchedIds.push(id); });\n        }\n      }\n    }\n    GENERAL_SCRIPTS.forEach(gen => {\n      const id = 'GENERAL_' + slug(gen.topic);\n      if (id === 'GENERAL_CARD_LIST' && (mentionsCard || matchedIds.length || oos)) return;\n      if (gen.keywords.some(kwContains) && !matchedIds.includes(id)) matchedIds.push(id);\n    });\n    if (APR_KEYWORDS.some(kwContains) && !matchedIds.includes('GENERAL_APR')) matchedIds.push('GENERAL_APR');\n    if (matchedIds.length > beforeCount) safetyNetAdded = true;\n  }\n\n  const scripts = matchedIds.map(id => SCRIPT_INDEX[id]);\n  let script = null;\n  if (scripts.length === 1) {\n    script = scripts[0];\n  } else if (scripts.length > 1) {\n    script = {\n      label: scripts.map(s => s.label).join(' + '),\n      response: combineScripts(scripts, 'response'),\n      responseZh: combineScripts(scripts, 'responseZh'),\n    };\n  }\n  \u002F\u002F If the safety net added an id the model's own reply text wasn't written to cover,\n  \u002F\u002F discard that reply and fall through to the raw combined script text below rather\n  \u002F\u002F than risk describing only part of a now-larger combined answer.\n  if (safetyNetAdded) reply = '';\n\n  \u002F\u002F A broad combined match (many topics at once, e.g. \"what are some special privileges\n  \u002F\u002F with each card\" resolving to all 16 cards' Overview) is exactly where a model's own\n  \u002F\u002F free paraphrase is riskiest: caught live, a real call correctly matched all 16 cards\n  \u002F\u002F but then invented \"up to 5% back\" for a card whose actual Overview text never\n  \u002F\u002F mentions a percentage at all -- one fabricated detail slipped into an otherwise\n  \u002F\u002F solid synthesis across that many facts. validateGroundedReply (below, at render time)\n  \u002F\u002F would eventually catch that specific case, but only after the whole reply -- including\n  \u002F\u002F whatever DID stay grounded -- gets discarded and the customer sees a bare escalation\n  \u002F\u002F instead of an answer. Below this threshold, a fabricated detail in a 1-4-topic reply is\n  \u002F\u002F still individually validated the exact same way, but the odds of it happening at all\n  \u002F\u002F are far lower with less to juggle, so the nicer natural paraphrase is worth keeping.\n  const BROAD_MATCH_TOPIC_COUNT = 5;\n  if (matchedIds.length >= BROAD_MATCH_TOPIC_COUNT) reply = '';\n\n  \u002F\u002F If the model didn't supply a reply (safety-net path, or it omitted the field),\n  \u002F\u002F use the matched script's own approved text directly rather than making a second\n  \u002F\u002F model call just to phrase it — that would reintroduce the two-call architecture\n  \u002F\u002F this function exists to remove, and the raw approved text is trivially grounded.\n  if (script && !reply) {\n    reply = lang === 'zh' ? (script.responseZh || script.response) : script.response;\n  }\n\n  if (script && oos) return { kind: 'partial', lang, script, reply, oos, usedContext };\n  if (script) return { kind: 'match', lang, script, reply, usedContext };\n  if (oos) return { kind: 'nomatch', lang, oos, usedContext };\n  return { ...fallback, usedContext };\n}\n\n\u002F\u002F Words that show up in most of the card library's own approved scripts (\"you\",\n\u002F\u002F \"card\", \"free\", generic connectors) provide no real signal that a reply is\n\u002F\u002F grounded in ONE SPECIFIC script -- a fabricated sentence using ordinary\n\u002F\u002F card-related vocabulary can rack up enough of these to clear the overlap bar\n\u002F\u002F even with zero genuine topical content. Excluding tokens that appear across a\n\u002F\u002F large share of ALL scripts keeps the check keyed to distinctive, topic-specific\n\u002F\u002F words instead of domain-wide filler.\nconst COMMON_TOKEN_DOC_FREQ_THRESHOLD = 0.3;\nfunction buildCommonTokenSet() {\n  const allScripts = Object.values(SCRIPT_INDEX).filter(s => s.response);\n  const total = allScripts.length;\n  const docFreq = new Map();\n  allScripts.forEach(s => {\n    const uniq = new Set(tokenize(s.response).filter(t => t.length > 2));\n    uniq.forEach(t => docFreq.set(t, (docFreq.get(t) || 0) + 1));\n  });\n  const common = new Set();\n  docFreq.forEach((c, t) => {\n    if (c \u002F total >= COMMON_TOKEN_DOC_FREQ_THRESHOLD) common.add(t);\n  });\n  return common;\n}\nconst COMMON_TOKENS = buildCommonTokenSet();\n\u002F\u002F tokenize() splits CJK text into single characters (fine for the app's own\n\u002F\u002F keyword\u002Ffuzzy matching elsewhere, which relies on that granularity), but a lone\n\u002F\u002F Chinese character is both too short to survive the (length > 2) filter above AND\n\u002F\u002F too information-poor to signal real grounding even if it did -- so the overlap\n\u002F\u002F check below was previously a silent no-op for every Chinese-language reply\n\u002F\u002F (0 surviving tokens = 'nothing to verify' = always ok). Two-character sliding-\n\u002F\u002F window bigrams over runs of CJK characters give a meaningful token unit\n\u002F\u002F instead, while still letting the same document-frequency exclusion\n\u002F\u002F (COMMON_TOKEN_DOC_FREQ_THRESHOLD) filter out domain-wide filler bigrams.\nfunction cjkBigrams(text) {\n  const runs = text.match(\u002F[\\u4e00-\\u9fff]+\u002Fg) || [];\n  const grams = [];\n  runs.forEach(run => {\n    for (let i = 0; i < run.length - 1; i++) grams.push(run.slice(i, i + 2));\n  });\n  return grams;\n}\nfunction buildCommonBigramSet() {\n  const allScripts = Object.values(SCRIPT_INDEX).filter(s => s.responseZh);\n  const total = allScripts.length;\n  const docFreq = new Map();\n  allScripts.forEach(s => {\n    const uniq = new Set(cjkBigrams(s.responseZh));\n    uniq.forEach(g => docFreq.set(g, (docFreq.get(g) || 0) + 1));\n  });\n  const common = new Set();\n  docFreq.forEach((c, g) => {\n    if (c \u002F total >= COMMON_TOKEN_DOC_FREQ_THRESHOLD) common.add(g);\n  });\n  return common;\n}\nconst COMMON_BIGRAMS_ZH = buildCommonBigramSet();\n\u002F\u002F Output validation (tech spec Performance Requirement #5): before a generated reply\n\u002F\u002F is ever shown or spoken, check it against the source script it's supposed to be\n\u002F\u002F grounded in — WITHOUT a second LLM call, per spec. Two deterministic checks stand\n\u002F\u002F in for \"an embedding\u002Fsimilarity check\": (1) every number in the reply (amounts,\n\u002F\u002F rates, dates) must appear in the source fact text, which catches an altered figure\n\u002F\u002F even when it would score as semantically near-identical to an embedding model; (2)\n\u002F\u002F a lightweight token-overlap ratio catches a reply that drifted away from the source\n\u002F\u002F entirely. On failure the caller must block playback and escalate, never speak an\n\u002F\u002F unverified response.\nfunction validateGroundedReply(reply, script, lang, allowTrailingUngrounded) {\n  if (!script) return { ok: true };\n  if (!reply) return { ok: false, reason: 'empty reply' };\n  const factText = (lang === 'zh' ? (script.responseZh || script.response) : script.response) || '';\n  const isZh = lang === 'zh';\n  const NUM_RE = \u002F(?:NT\\$|US\\$|\\$)?\\d[\\d,]*(?:\\.\\d+)?%?\u002Fg;\n  const SCALE_RE = \u002F((?:NT\\$|US\\$|\\$)?)(\\d[\\d,]*(?:\\.\\d+)?)\\s*(million|billion|thousand|萬|億)\u002Fgi;\n  \u002F\u002F A hyphenated range in the SOURCE ('NT$1,000-1,500') only carries the currency\n  \u002F\u002F prefix on its first number -- English convention leaves it implicit on the\n  \u002F\u002F second ('...1,500' means NT$1,500, not a bare unitless 1,500). A correct reply\n  \u002F\u002F that spells the range out more explicitly (\"NT$1,000 to NT$1,500\", prefix on\n  \u002F\u002F both ends) would otherwise fail to match, since \"NT$1500\" never appears\n  \u002F\u002F verbatim in the source. Only applied to the FACT side -- this documents what\n  \u002F\u002F the range in the source already implies, it doesn't loosen what a reply is\n  \u002F\u002F allowed to claim.\n  const RANGE_RE = \u002F(NT\\$|US\\$|\\$)(\\d[\\d,]*(?:\\.\\d+)?)\\s*-\\s*(\\d[\\d,]*(?:\\.\\d+)?)\u002Fg;\n  \u002F\u002F Compare by NUMERIC VALUE, not raw text -- \"3%\" and \"3.0%\" (or \"NT$50,000\" and\n  \u002F\u002F \"NT$50000.00\") are the same real figure, but as plain strings they'd never\n  \u002F\u002F match and a correct answer would be wrongly rejected just for using a\n  \u002F\u002F different (still accurate) decimal\u002Fcomma style than the source script.\n  const CANON_RE = \u002F^((?:NT\\$|US\\$|\\$)?)([\\d,]+(?:\\.\\d+)?)(%?)$\u002F;\n  function canonicalizeNum(raw) {\n    const m = raw.match(CANON_RE);\n    if (!m) return raw;\n    const prefix = m[1] || '';\n    const value = parseFloat(m[2].replace(\u002F,\u002Fg, ''));\n    return prefix + value + m[3];\n  }\n  \u002F\u002F Every number occurrence in `text`, tagged with its canonical value AND its\n  \u002F\u002F position -- so a reply figure can be checked not just against \"does this\n  \u002F\u002F value exist somewhere in the source\" (which a same-fact digit swap, e.g.\n  \u002F\u002F reusing a real \"2\" to replace a real \"7\" a few words over, would sail\n  \u002F\u002F through) but \"does it exist at a spot whose surrounding words match\",\n  \u002F\u002F checked below once every occurrence on both sides is collected.\n  function extractNumOccurrences(text) {\n    const occs = [];\n    const scaleSpans = [];\n    SCALE_RE.lastIndex = 0;\n    let m;\n    \u002F\u002F A correct paraphrase may spell out a large figure in full digits\n    \u002F\u002F (NT$50,000,000) where the source uses a word-scaled form (NT$50 million,\n    \u002F\u002F or 5,000萬 in Chinese) or vice versa -- same real value, different\n    \u002F\u002F notation. Registering the expanded form (on both reply and fact text)\n    \u002F\u002F lets either notation ground the other; the span is also tracked so the\n    \u002F\u002F plain NUM_RE pass below can skip the bare \"50\" it would otherwise pull\n    \u002F\u002F out of \"50 million\" as a spurious, un-scaled number of its own.\n    while ((m = SCALE_RE.exec(text))) {\n      const prefix = m[1] || '';\n      const base = parseFloat(m[2].replace(\u002F,\u002Fg, ''));\n      const word = m[3].toLowerCase();\n      const scale = word === 'million' ? 1e6 : word === 'billion' ? 1e9 : word === 'thousand' ? 1e3 : word === '萬' ? 1e4 : 1e8;\n      occs.push({ canon: prefix + String(Math.round(base * scale)), index: m.index, len: m[0].length });\n      scaleSpans.push([m.index, m.index + m[0].length]);\n    }\n    const inScaleSpan = (idx) => scaleSpans.some(([s, e]) => idx >= s && idx < e);\n    NUM_RE.lastIndex = 0;\n    while ((m = NUM_RE.exec(text))) {\n      if (inScaleSpan(m.index)) continue;\n      occs.push({ canon: canonicalizeNum(m[0]), index: m.index, len: m[0].length });\n    }\n    RANGE_RE.lastIndex = 0;\n    while ((m = RANGE_RE.exec(text))) {\n      const secondIndex = m.index + m[0].length - m[3].length;\n      occs.push({ canon: m[1] + parseFloat(m[3].replace(\u002F,\u002Fg, '')), index: secondIndex, len: m[3].length });\n    }\n    return occs;\n  }\n  function contentTokens(str) {\n    return isZh\n      ? new Set(cjkBigrams(str).filter(g => !COMMON_BIGRAMS_ZH.has(g)))\n      : new Set(tokenize(str).filter(t => t.length > 3 && !COMMON_TOKENS.has(t)));\n  }\n  \u002F\u002F A fixed CHARACTER radius here (previously 10) can't survive ordinary paraphrase\n  \u002F\u002F reordering: caught live against a real (non-Claude) model, \"It's NT$2,000 a year for\n  \u002F\u002F the primary cardholder\" (source) vs \"...annual fee is NT$2,000 for the primary\n  \u002F\u002F cardholder\" (reply, otherwise perfectly accurate) share the same clause, just\n  \u002F\u002F reworded BEFORE the number -- a 10-char window forward+backward is too narrow to\n  \u002F\u002F ever reach \"primary\"\u002F\"cardholder\" past the extra words. Widening the raw radius\n  \u002F\u002F doesn't work either: at any width generous enough to fix that case, it also erases\n  \u002F\u002F the clause boundary the existing digit-swap regression test relies on (two DIFFERENT\n  \u002F\u002F numbers -- 7 vs 2 -- close together in one short, comma-joined sentence).\n  \u002F\u002F\n  \u002F\u002F Fixed by bounding context at the nearest clause punctuation (comma\u002Fsemicolon\u002Fperiod\u002F\n  \u002F\u002F em dash, in either language) instead of a fixed character count, with a generous\n  \u002F\u002F character cap only as a backstop for unusually long unpunctuated runs. This keeps\n  \u002F\u002F clauses separated by a comma properly apart (restoring the digit-swap check) while\n  \u002F\u002F giving a same-clause reordering enough room to find its overlap. It also reopens a\n  \u002F\u002F narrower false-accept: when a fact repeats a word across two adjacent, comma-joined\n  \u002F\u002F clauses (e.g. \"...at Taoyuan or Kaohsiung airport, 2 sessions per airport\" repeats\n  \u002F\u002F \"airport\"), that single shared word can now survive clause-bounding as one incidental\n  \u002F\u002F overlap. Requiring 2+ overlapping tokens (not just any 1) when both sides have enough\n  \u002F\u002F words to support that closes it -- the genuine same-clause case above shares two\n  \u002F\u002F words (\"primary\", \"cardholder\"), the digit-swap only ever shares that one incidental\n  \u002F\u002F repeated word.\n  const MAX_CONTEXT_CHARS = 80;\n  const CLAUSE_BOUNDARY_RE = \u002F[,;.!?、，。！？—–]\u002F;\n  function clauseBoundedSpan(text, index, len, before) {\n    if (before) {\n      const start = Math.max(0, index - MAX_CONTEXT_CHARS);\n      const slice = text.slice(start, index);\n      let boundaryPos = -1;\n      for (let i = slice.length - 1; i >= 0; i--) { if (CLAUSE_BOUNDARY_RE.test(slice[i])) { boundaryPos = i; break; } }\n      return boundaryPos === -1 ? slice : slice.slice(boundaryPos + 1);\n    }\n    const end = Math.min(text.length, index + len + MAX_CONTEXT_CHARS);\n    const slice = text.slice(index + len, end);\n    const boundaryPos = slice.search(CLAUSE_BOUNDARY_RE);\n    return boundaryPos === -1 ? slice : slice.slice(0, boundaryPos);\n  }\n  function contextTokens(text, index, len) {\n    return contentTokens(clauseBoundedSpan(text, index, len, true) + ' ' + clauseBoundedSpan(text, index, len, false));\n  }\n  const factOccs = extractNumOccurrences(factText);\n  const replyOccs = extractNumOccurrences(reply);\n  for (const ro of replyOccs) {\n    const candidates = factOccs.filter(fo => fo.canon === ro.canon);\n    if (!candidates.length) {\n      return { ok: false, reason: 'number not grounded in source script: \"' + ro.canon + '\"' };\n    }\n    \u002F\u002F Only worth disambiguating by context when the source has more than one\n    \u002F\u002F number total -- with a single number in the whole fact there's no other\n    \u002F\u002F slot to confuse it with, so value-membership above is already exact.\n    if (factOccs.length <= 1) continue;\n    const roCtx = contextTokens(reply, ro.index, ro.len);\n    if (!roCtx.size) continue; \u002F\u002F no distinctive nearby words to disambiguate with -- don't invent a false rejection\n    const matched = candidates.some(fo => {\n      const foCtx = contextTokens(factText, fo.index, fo.len);\n      if (!foCtx.size) return true; \u002F\u002F source side has nothing distinctive either -- can't discriminate, don't penalize\n      const overlap = [...roCtx].filter(t => foCtx.has(t)).length;\n      const needed = (roCtx.size >= 2 && foCtx.size >= 2) ? 2 : 1;\n      return overlap >= needed;\n    });\n    if (!matched) {\n      return { ok: false, reason: 'number \"' + ro.canon + '\" appears in source but not in this context: ' + JSON.stringify(reply) };\n    }\n  }\n  \u002F\u002F Score groundedness per SENTENCE, requiring EVERY content-bearing sentence to\n  \u002F\u002F clear the bar (not just the best one) -- otherwise a fabricated claim can ride\n  \u002F\u002F along next to one truthful sentence and the whole reply still passes. The one\n  \u002F\u002F narrow exemption: when allowTrailingUngrounded is set (the classifier found a\n  \u002F\u002F genuine partial-match, so the system prompt instructed the model to append an\n  \u002F\u002F escalation closer), the FINAL sentence is allowed to have near-zero overlap by\n  \u002F\u002F design, since it is boilerplate handoff text, not a factual claim. That\n  \u002F\u002F exemption never applies to a plain in-scope 'match' reply, which has no\n  \u002F\u002F business containing an ungrounded sentence anywhere, first or last.\n  \u002F\u002F A broad question with no card named (e.g. \"what's the annual fee?\") can match\n  \u002F\u002F MANY cards at once, and combineScripts joins their fact text into one reply\n  \u002F\u002F prefixed per-card with '•'. Pooling every combined card's vocabulary into\n  \u002F\u002F a single token set makes the check WEAKER, not stronger, as more cards get\n  \u002F\u002F combined: a fabricated sentence can stitch together words borrowed from\n  \u002F\u002F several different cards' real facts and still clear the bar, without being\n  \u002F\u002F true of any single one of them. Splitting back into per-card chunks (never\n  \u002F\u002F present in an individual, non-combined script's own text) and requiring a\n  \u002F\u002F sentence to overlap well with at least ONE specific chunk -- not the union of\n  \u002F\u002F all of them -- closes that hole while leaving the common single-card case\n  \u002F\u002F (exactly one chunk) identical to the prior behavior.\n  const factChunks = factText.indexOf('•') === -1 ? [factText] : factText.split('\\n').map(function (s) { return s.trim(); }).filter(Boolean);\n  const chunkTokenSets = factChunks.map(function (chunk) {\n    return isZh ? new Set(cjkBigrams(chunk)) : new Set(tokenize(chunk));\n  });\n  const sentences = reply.split(\u002F(?<=[.!?。!?])\u002F).map(function (s) { return s.trim(); }).filter(Boolean);\n  \u002F\u002F Caught live (real model behind a real API key, not a hand-authored test fixture):\n  \u002F\u002F a plain in-scope 'match' reply — no oos, so allowTrailingUngrounded was false —\n  \u002F\u002F got rejected and escalated purely because its own final sentence was a friendly\n  \u002F\u002F follow-up question (\"Would you like me to go into more detail on any specific\n  \u002F\u002F perk?\"), which naturally has ~0% fact overlap since it isn't a factual claim at\n  \u002F\u002F all, just an invitation to continue. A question can't assert a fabricated fact\n  \u002F\u002F the way a trailing STATEMENT could (the exact risk this whole check exists to\n  \u002F\u002F block), and any number it did contain would still be caught by the numeric-\n  \u002F\u002F grounding pass above regardless of sentence position -- so exempting a trailing\n  \u002F\u002F QUESTION from the per-sentence overlap check is safe even outside the OOS-combo\n  \u002F\u002F case, without reopening the door the original allowTrailingUngrounded flag was\n  \u002F\u002F built to keep shut for trailing STATEMENTS.\n  const lastSentence = sentences[sentences.length - 1] || '';\n  const lastIsQuestion = \u002F[?？]\\s*$\u002F.test(lastSentence);\n  const checkCount = ((allowTrailingUngrounded || lastIsQuestion) && sentences.length > 1) ? sentences.length - 1 : sentences.length;\n  for (let i = 0; i < checkCount; i++) {\n    const tokens = isZh\n      ? cjkBigrams(sentences[i]).filter(g => !COMMON_BIGRAMS_ZH.has(g))\n      : tokenize(sentences[i]).filter(t => t.length > 2 && !COMMON_TOKENS.has(t));\n    if (!tokens.length) continue;\n    \/\/ A bare conversational opener (\"Sure!\", \"Of course!\") has too little content to\n    \/\/ assert a fabricated fact -- same reasoning as the trailing-question exemption\n    \/\/ above, generalized to any short, low-content sentence. Any number it did\n    \/\/ contain would still be caught by the numeric-grounding pass above regardless\n    \/\/ of sentence position, so this stays safe even for a short sentence.\n    if (tokens.length <= 2 && !\/\\d\/.test(sentences[i])) continue;\n    let bestRatio = 0;\n    for (const factTokens of chunkTokenSets) {\n      const overlap = tokens.filter(t => factTokens.has(t) || (!isZh && [...factTokens].some(ft => closeEnough(t, ft)))).length;\n      bestRatio = Math.max(bestRatio, overlap \u002F tokens.length);\n    }\n    if (bestRatio < 0.25) {\n      return { ok: false, reason: 'low fact overlap in sentence: ' + JSON.stringify(sentences[i]) + ' (' + Math.round(bestRatio * 100) + '%)' };\n    }\n  }\n  return { ok: true };\n}\n\nconst STRINGS = {\n  pocDemo: { en: 'PoC demo', zh: '概念驗證展示' },\n  demoCall: { en: 'Demo call', zh: '展示通話' },\n  analytics: { en: 'Analytics', zh: '數據分析' },\n  typeQuery: { en: 'Type a query', zh: '輸入問題' },\n  queryPlaceholder: { en: 'Ask about a credit card...', zh: '請輸入信用卡相關問題...' },\n  send: { en: 'Send', zh: '送出' },\n  sending: { en: 'Sending…', zh: '傳送中…' },\n  sampleQueries: { en: 'Sample queries', zh: '範例問題' },\n  pipeline: { en: 'Pipeline', zh: '處理流程' },\n  pipelineNote: { en: \"Intent classification is a live semantic call to Claude, routed against the approved script library — response text always comes from the script library, never the model's own words.\", zh: '意圖分類是即時語意呼叫Claude,並比對核准的話術庫——回覆文字一律來自話術庫,絕非模型自行生成的文字。' },\n  stageAudio: { en: 'Audio capture', zh: '音訊擷取' },\n  stageStt: { en: 'Speech-to-text', zh: '語音轉文字' },\n  stageLlm: { en: 'Intent + generation', zh: '意圖判斷與生成' },\n  stageValidate: { en: 'Output validation', zh: '輸出驗證' },\n  stageTts: { en: 'Text-to-speech', zh: '文字轉語音' },\n  noConvo: { en: 'No conversation yet', zh: '尚無對話' },\n  noConvoHelp: { en: 'Press the mic or send a sample query to see the assistant respond, including escalation for out-of-scope requests.', zh: '請按下麥克風或送出範例問題,查看助理如何回應,包含超出範圍時的轉接處理。' },\n  tagMatch: { en: 'Matched response', zh: '已比對回覆' },\n  tagPartial: { en: 'Partial match — escalating remainder', zh: '部分比對——其餘轉接處理' },\n  tagNomatch: { en: 'No match — escalated to CSR', zh: '無比對——已轉接客服' },\n  usingContext: { en: 'Using context from earlier in this conversation', zh: '運用本次對話先前內容' },\n  ready: { en: 'Ready', zh: '準備就緒' },\n  listeningStatus: { en: 'Listening…', zh: '聆聽中…' },\n  processingStatus: { en: 'Processing…', zh: '處理中…' },\n  micUnavailable: { en: 'Mic unavailable', zh: '麥克風無法使用' },\n  helpTapToSpeak: { en: 'Tap to speak, or type below.', zh: '點擊說話,或於下方輸入。' },\n  helpSpeakNow: { en: \n  Object.keys(STRINGS).forEach(k => { t[k] = STRINGS[k][lang] || STRINGS[k].en; });\n  return t;\n}\n\nclass Component extends DCLogic {\n  state = {\n    tab: 'demo', query: '', listening: false, processing: false, stageIndex: -1,\n    messages: [], log: this.loadLog(), micSupported: null, expandedLogId: null, micLang: 'en-US',\n    voiceOn: (() => { try { const v = localStorage.getItem('csrDemoVoiceOn'); if (v !== null) return v === 'true'; } catch (e) {} return true; })(),\n    mode: 'llm', apiError: null, queue: [], chartStyle: 'bars',\n    apiKeyInput: (() => { try { return localStorage.getItem('csrDemoApiKey') || ''; } catch (e) { return ''; } })(),\n    conversationId: Date.now() + '-' + Math.random().toString(36).slice(2, 8),\n    streamMsgId: null, streamFull: '', streamPos: 0,\n  };\n\n  pickVoice() {\n    if (this._voice) return this._voice;\n    const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];\n    const preferred = ['Google US English', 'Samantha', 'Microsoft Aria Online (Natural)', 'Microsoft Jenny Online (Natural)', 'Microsoft Guy Online (Natural)'];\n    let voice = voices.find(v => preferred.includes(v.name))\n      || voices.find(v => \u002Fnatural|neural\u002Fi.test(v.name))\n      || voices.find(v => v.lang === 'en-US' && \u002Fgoogle\u002Fi.test(v.name))\n      || voices.find(v => v.lang && v.lang.startsWith('en'))\n      || voices[0];\n    this._voice = voice;\n    return voice;\n  }\n\n  speak(text) {\n    const utter = new SpeechSynthesisUtterance(text);\n    const cjkCount = (text.match(\u002F[\\u4e00-\\u9fff]\u002Fg) || []).length;\n    const latinCount = (text.match(\u002F[A-Za-z]\u002Fg) || []).length;\n    const isZh = cjkCount > latinCount;\n    if (isZh) {\n      utter.lang = 'zh-TW';\n      const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];\n      const zhVoice = voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang && v.lang.startsWith('zh'));\n      if (zhVoic
